<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <div class="container mt-5">
    <h2 class="text-center">App Calculadora</h2>
    <div class="card p-4">
      <div class="mb-3">
        <label for="valor1" class="form-label">Número 1:</label>
        <input type="number" id="valor1" class="form-control">
      </div>
      <div class="mb-3">
        <label for="valor2" class="form-label">Número 2:</label>
        <input type="number" id="valor2" class="form-control">
      </div>
      <div class="mb-3">
        <label for="operacion" class="form-label">Operación:</label>
        <select id="operacion" class="form-select">
          <option value="" selected disabled>Selecciona una opción</option>
          <option value="resta">Resta</option>
          <option value="suma">Suma</option>
          <option value="division">División</option>
        </select>
      </div>
      <button id="calcular" class="btn btn-primary w-100">Calcular</button>
      <h4 class="mt-3 text-center">Resultado: <span id="resultado">-</span></h4>            
      <ul id="historial" class="list-group mt-3"></ul>   <!-- NUEVO -->
    </div>

    </div>
  </div>

  <script type="module">
    import { calculadora } from './app/calculadora.js';

    import { guardarOperacion, obtenerHistorial } from './app/historial.js';

    
    document.addEventListener("DOMContentLoaded", function() {
      
      document.getElementById('calcular').addEventListener('click', () => {
        const valor1 = parseFloat(document.getElementById('valor1').value);
        const valor2 = parseFloat(document.getElementById('valor2').value);
        const operacion = document.getElementById('operacion').value;

        if (!isNaN(valor1) && !isNaN(valor2)) {
          // Se ejecuta la función
          const resultado = calculadora(valor1, valor2, operacion);
          document.getElementById('resultado').textContent = resultado;
          console.log('resultado', resultado);

          // NUEVO
          guardarOperacion({ valor1, valor2, operacion, resultado });
          document.getElementById('historial').innerHTML = obtenerHistorial()
            .map(historial => `<li class="list-group-item">${historial.valor1} ${historial.operacion} ${historial.valor2} = ${historial.resultado}</li>`)
            .join('');

        } else {
          document.getElementById('resultado').textContent = 'Error';
        
        }

          
      });
      

    });

    
    
  </script>
</body>

</html>
